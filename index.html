<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ledger</title>
<meta name="description" content="Private, offline personal finance: accounts, cards, spending, investments and an encrypted vault.">
<meta name="theme-color" content="#F1F3F8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("ledger:theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light")}catch(e){}</script>
<style>:root {
  --bg: #F1F3F8; --surface: #FFFFFF; --surface-2: #F6F7FB; --line: #E3E7EF; --line-2: #EDF0F5;
  --ink: #111831; --ink-2: #4B5470; --ink-3: #858DA6;
  --primary: #2B45D4; --primary-press: #2037B8; --primary-ink: #FFFFFF; --primary-soft: #E8ECFD;
  --pos: #0E8F62; --warn: #B96F0B; --neg: #CF3348;
  --pos-bg: #E2F5EC; --warn-bg: #FDF0DB; --neg-bg: #FCE7EA; --muted-bg: #EEF0F5;
  --hero: #2B45D4; --hero-ink: #FFFFFF; --hero-ink-2: rgba(255,255,255,.72);
  --shadow: 0 1px 2px rgba(17,24,49,.04), 0 4px 16px rgba(17,24,49,.05);
  --t-blue: #2B45D4; --t-blue-bg: #E8ECFD;
  --t-rose: #CF3358; --t-rose-bg: #FCE8EE;
  --t-amber: #B46A08; --t-amber-bg: #FDF0DC;
  --t-violet: #7042D6; --t-violet-bg: #F0E9FC;
  --t-teal: #08847F; --t-teal-bg: #DFF4F2;
  --t-green: #10905E; --t-green-bg: #E1F5EB;
  --t-sky: #1A78B8; --t-sky-bg: #E2F0FA;
  --t-slate: #5B6480; --t-slate-bg: #ECEFF5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1020; --surface: #141A2D; --surface-2: #1A2136; --line: #252D46; --line-2: #1F2740;
    --ink: #E9ECF6; --ink-2: #A8B0C8; --ink-3: #6E7792;
    --primary: #7186FF; --primary-press: #8C9DFF; --primary-ink: #0C1020; --primary-soft: #1F2856;
    --pos: #4FD19A; --warn: #F2B457; --neg: #FF7A8A;
    --pos-bg: #12301F; --warn-bg: #33260F; --neg-bg: #3A1720; --muted-bg: #1F2640;
    --hero: #22307F; --hero-ink: #F2F4FF; --hero-ink-2: rgba(242,244,255,.7);
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    --t-blue: #8FA0FF; --t-blue-bg: #1D2552; --t-rose: #FF8FAA; --t-rose-bg: #3A1827;
    --t-amber: #F4BA5E; --t-amber-bg: #372912; --t-violet: #B89BFF; --t-violet-bg: #2A1F4A;
    --t-teal: #5AD3CD; --t-teal-bg: #11322F; --t-green: #5BD29E; --t-green-bg: #123222;
    --t-sky: #7CC3F2; --t-sky-bg: #142A3D; --t-slate: #A8B0C8; --t-slate-bg: #222A42;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1020; --surface: #141A2D; --surface-2: #1A2136; --line: #252D46; --line-2: #1F2740;
  --ink: #E9ECF6; --ink-2: #A8B0C8; --ink-3: #6E7792;
  --primary: #7186FF; --primary-press: #8C9DFF; --primary-ink: #0C1020; --primary-soft: #1F2856;
  --pos: #4FD19A; --warn: #F2B457; --neg: #FF7A8A;
  --pos-bg: #12301F; --warn-bg: #33260F; --neg-bg: #3A1720; --muted-bg: #1F2640;
  --hero: #22307F; --hero-ink: #F2F4FF; --hero-ink-2: rgba(242,244,255,.7);
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  --t-blue: #8FA0FF; --t-blue-bg: #1D2552; --t-rose: #FF8FAA; --t-rose-bg: #3A1827;
  --t-amber: #F4BA5E; --t-amber-bg: #372912; --t-violet: #B89BFF; --t-violet-bg: #2A1F4A;
  --t-teal: #5AD3CD; --t-teal-bg: #11322F; --t-green: #5BD29E; --t-green-bg: #123222;
  --t-sky: #7CC3F2; --t-sky-bg: #142A3D; --t-slate: #A8B0C8; --t-slate-bg: #222A42;
  color-scheme: dark;
}

:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; background: var(--bg); }
body {
  font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  transition: background-color .2s ease, color .2s ease;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, h4 { margin: 0; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.t-pos { color: var(--pos); } .t-neg { color: var(--neg); } .t-warn { color: var(--warn); }

/* layout */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; align-self: start; height: 100vh; display: flex; flex-direction: column;
  padding: 22px 14px 18px; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--primary); color: var(--primary-ink); }
.brand-name { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
.side-cta { width: 100%; justify-content: center; margin-bottom: 18px; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; border: 0; border-radius: 12px;
  background: transparent; color: var(--ink-2); font-weight: 600; font-size: 14px; text-align: left;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--primary-soft); color: var(--ink); }
.nav-ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--tone-bg); color: var(--tone); flex-shrink: 0; }
.side-foot { margin-top: auto; padding-top: 18px; display: flex; flex-direction: column; gap: 6px; }
.sync-note { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-3); padding: 0 10px; font-weight: 600; }

.main { padding: 30px clamp(18px, 3.2vw, 44px) 60px; min-width: 0; max-width: 1180px; width: 100%; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.top h1 { font-size: clamp(24px, 2.6vw, 30px); font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; }
.top p { margin: 4px 0 0; color: var(--ink-2); font-size: 14.5px; }
.top-actions { display: flex; gap: 8px; }
.icon-btn.only-mobile { display: none; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }

/* tones */
.tone-blue { --tone: var(--t-blue); --tone-bg: var(--t-blue-bg); }
.tone-rose { --tone: var(--t-rose); --tone-bg: var(--t-rose-bg); }
.tone-amber { --tone: var(--t-amber); --tone-bg: var(--t-amber-bg); }
.tone-violet { --tone: var(--t-violet); --tone-bg: var(--t-violet-bg); }
.tone-teal { --tone: var(--t-teal); --tone-bg: var(--t-teal-bg); }
.tone-green { --tone: var(--t-green); --tone-bg: var(--t-green-bg); }
.tone-sky { --tone: var(--t-sky); --tone-bg: var(--t-sky-bg); }
.tone-slate { --tone: var(--t-slate); --tone-bg: var(--t-slate-bg); }
.chip { display: inline-grid; place-items: center; border-radius: 30%; background: var(--tone-bg); color: var(--tone); flex-shrink: 0; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 14px; white-space: nowrap;
  transition: background-color .15s, border-color .15s, transform .1s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { background: var(--primary-press); border-color: var(--primary-press); }
.btn-soft { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
.btn-soft:hover { background: var(--primary-soft); filter: brightness(.97); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-danger { background: var(--neg); border-color: var(--neg); color: #fff; }
.btn-ghost-danger { background: transparent; border-color: transparent; color: var(--neg); }
.btn-sm { height: 32px; padding: 0 11px; font-size: 13px; border-radius: 10px; gap: 5px; }
.icon-btn {
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-2);
}
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }
.icon-btn.subtle { width: 32px; height: 32px; border-color: transparent; background: transparent; border-radius: 10px; color: var(--ink-3); }
.icon-btn.subtle:hover { color: var(--neg); background: var(--neg-bg); }
.link { border: 0; background: none; color: var(--primary); font-weight: 700; font-size: 13.5px; padding: 4px 2px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* hero */
.hero {
  position: relative; overflow: hidden; border-radius: 24px; background: var(--hero); color: var(--hero-ink);
  padding: 24px clamp(20px, 3vw, 32px) 22px;
}
.hero-art { position: absolute; right: -10px; top: -10px; width: 260px; height: 260px; color: rgba(255,255,255,.14); pointer-events: none; }
.hero-top { display: flex; align-items: center; gap: 8px; color: var(--hero-ink-2); font-weight: 600; font-size: 14px; position: relative; }
.hero-eye { border: 0; background: rgba(255,255,255,.12); color: var(--hero-ink); width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
.hero-eye:hover { background: rgba(255,255,255,.2); }
.hero-eye:focus-visible { outline-color: #fff; }
.hero-value { position: relative; font-size: clamp(34px, 5.4vw, 52px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; margin: 8px 0 22px; }
.hero-split { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; border-top: 1px solid rgba(255,255,255,.16); padding-top: 16px; }
.hero-split span { display: block; font-size: 12.5px; color: var(--hero-ink-2); font-weight: 600; }
.hero-split b { font-size: 18px; font-weight: 800; }

.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.quick-btn {
  display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 700; font-size: 14px; text-align: left; box-shadow: var(--shadow);
}
.quick-btn:hover { border-color: var(--primary); }

.nudge {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; border-radius: 16px;
  background: var(--primary-soft); color: var(--ink); font-size: 14px; font-weight: 600;
}
.nudge svg { color: var(--primary); flex-shrink: 0; }
.nudge span { flex: 1; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; flex: 1; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.stat-top { display: flex; align-items: center; gap: 9px; }
.stat-label { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.stat-value { font-size: 22px; font-weight: 800; margin-top: 10px; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.stat-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; font-weight: 500; }
.section-bar { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.section-bar .stats { min-width: min(100%, 300px); }
.section-action { flex-shrink: 0; }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; }
.panel-head h3 { font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em; }
.panel-body { padding: 14px 20px 18px; }
.panel-body.flush { padding: 8px 0 6px; }
.panel-note { margin: 10px 0 0; font-size: 13px; color: var(--ink-3); }
.footnote { margin: -4px 4px 0; font-size: 12.5px; color: var(--ink-3); }
.muted-p { margin: 0; color: var(--ink-2); font-size: 14px; }

/* rows */
.list { display: flex; flex-direction: column; }
.row { display: flex; gap: 14px; padding: 13px 20px; align-items: flex-start; }
.row + .row { border-top: 1px solid var(--line-2); }
.row-muted .row-title, .row-muted .row-val { color: var(--ink-3); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 1px; }
.row-line { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.row-text { min-width: 0; }
.row-title { font-weight: 700; font-size: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; overflow-wrap: anywhere; }
.row-sub { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.row-val { text-align: right; font-weight: 800; font-size: 15.5px; flex-shrink: 0; }
.row-val .row-sub { font-weight: 600; margin-top: 2px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.badge-pos { background: var(--pos-bg); color: var(--pos); }
.badge-warn { background: var(--warn-bg); color: var(--warn); }
.badge-neg { background: var(--neg-bg); color: var(--neg); }
.badge-muted { background: var(--muted-bg); color: var(--ink-2); }
.bar { height: 6px; border-radius: 99px; background: var(--muted-bg); overflow: hidden; max-width: 420px; }
.bar-fill { display: block; height: 100%; border-radius: 99px; transition: width .3s ease; }
.fill-pos { background: var(--pos); } .fill-warn { background: var(--warn); } .fill-neg { background: var(--neg); } .fill-blue { background: var(--primary); }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 26px 20px 24px; }
.empty-title { font-weight: 800; font-size: 15.5px; margin-top: 4px; }
.empty p { margin: 0 0 6px; color: var(--ink-3); font-size: 13.5px; max-width: 42ch; }

/* charts */
.health { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.gauge { width: 200px; max-width: 100%; flex-shrink: 0; }
.gauge-track { fill: none; stroke: var(--muted-bg); stroke-width: 14; stroke-linecap: round; }
.gauge-val { fill: none; stroke-width: 14; stroke-linecap: round; transition: stroke-dasharray .6s ease; }
.gauge-num { font-size: 38px; font-weight: 800; fill: var(--ink); font-family: inherit; font-variant-numeric: tabular-nums; }
.gauge-word { font-size: 13px; font-weight: 700; font-family: inherit; }
.stroke-pos { stroke: var(--pos); } .stroke-warn { stroke: var(--warn); } .stroke-neg { stroke: var(--neg); }
.fill-pos { fill: var(--pos); } .fill-warn { fill: var(--warn); } .fill-neg { fill: var(--neg); }
.factors { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 10px; }
.factors li { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink-2); font-weight: 600; }
.factors b { margin-left: auto; color: var(--ink); font-weight: 800; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.bg-pos { background: var(--pos); } .bg-warn { background: var(--warn); }
.bg-blue { background: var(--t-blue); } .bg-teal { background: var(--t-teal); } .bg-violet { background: var(--t-violet); } .bg-rose { background: var(--t-rose); } .bg-amber { background: var(--t-amber); }
.chart { width: 100%; height: auto; display: block; }
.axis { stroke: var(--line); stroke-width: 1; }
.bar-now { fill: var(--primary); } .bar-fut { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 1; stroke-dasharray: 3 3; } .bar-neg { fill: var(--neg); opacity: .8; }
.chart-val { font-size: 11px; font-weight: 700; fill: var(--ink); font-family: inherit; font-variant-numeric: tabular-nums; }
.chart-lbl { font-size: 11.5px; font-weight: 600; fill: var(--ink-3); font-family: inherit; }
.donut-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.donut { width: 150px; height: 150px; flex-shrink: 0; }
.donut-track { fill: none; stroke: var(--muted-bg); stroke-width: 13; }
.donut-seg { fill: none; stroke-width: 13; }
.stroke-blue { stroke: var(--t-blue); } .stroke-teal { stroke: var(--t-teal); } .stroke-violet { stroke: var(--t-violet); } .stroke-rose { stroke: var(--t-rose); } .stroke-amber { stroke: var(--t-amber); }
.legend { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 190px; display: flex; flex-direction: column; gap: 9px; }
.legend li { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.legend-name { flex: 1; }
.legend b { color: var(--ink); font-weight: 800; }
.legend-pct { width: 38px; text-align: right; color: var(--ink-3); font-size: 12.5px; }

/* forms */
.form-grid { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.narrow { max-width: 360px; margin-top: 14px; }
.field-label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.opt { font-weight: 500; color: var(--ink-3); }
.field-hint { font-size: 12.5px; color: var(--ink-3); }
.field-hint b { color: var(--ink); }
.input {
  width: 100%; height: 44px; padding: 0 13px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); outline: none; transition: border-color .15s, background-color .15s;
}
textarea.input { height: auto; padding: 10px 13px; resize: vertical; }
.input.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.input:focus, .money-input:focus-within { border-color: var(--primary); background: var(--surface); }
.money-input { display: flex; align-items: center; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); padding-left: 13px; transition: border-color .15s; }
.money-input span { color: var(--ink-3); font-weight: 700; }
.money-input input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; outline: none; padding: 0 13px 0 6px; font-variant-numeric: tabular-nums; font-weight: 700; }
.fixed-amt { font-size: 24px; font-weight: 800; }
.form-err, .form-ok { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; font-size: 13.5px; font-weight: 600; }
.form-err { background: var(--neg-bg); color: var(--neg); }
.form-ok { background: var(--pos-bg); color: var(--pos); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 13px; background: var(--muted-bg); max-width: 100%; }
.seg button { border: 0; background: transparent; height: 36px; padding: 0 14px; border-radius: 10px; font-weight: 700; font-size: 13.5px; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(17,24,49,.12); }
.tabs-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.settings-block { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
.settings-row .sync-note { padding: 0; }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(8,12,26,.5); display: grid; place-items: center; padding: 20px; animation: fade .15s ease; }
.sheet {
  width: min(520px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column;
  background: var(--surface); border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.25); animation: rise .2s ease;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 6px; }
.sheet-head h2 { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.sheet-body { padding: 12px 20px 16px; overflow-y: auto; }
.sheet-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px 18px; border-top: 1px solid var(--line); }
.more-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.more-item { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); font-weight: 700; font-size: 14px; text-align: left; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }

/* planner */
.planner-form { display: grid; grid-template-columns: 1.4fr 1fr auto; gap: 14px; align-items: end; }
.planner-go { grid-column: 1 / -1; }
.verdict { display: flex; align-items: center; gap: 14px; }
.verdict-label { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; color: var(--tone); }
.verdict-sub { color: var(--ink-2); font-size: 14px; font-weight: 600; }
.reasons { margin: 14px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 14px; display: flex; flex-direction: column; gap: 5px; max-width: 70ch; }
.timing { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--warn-bg); color: var(--ink); font-size: 14px; font-weight: 600; }
.timing svg { color: var(--warn); margin-top: 2px; flex-shrink: 0; }
.timing.ready { background: var(--pos-bg); }
.timing.ready svg { color: var(--pos); }
.sub-h { font-size: 14px; font-weight: 800; margin: 20px 0 10px; }
.pay-opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.pay-opt {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 14px 12px;
  border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); text-align: left;
}
.pay-opt.on { border-color: var(--primary); background: var(--primary-soft); }
.pay-title { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.pay-amt { font-size: 16.5px; font-weight: 800; }
.pay-note { font-size: 12px; font-weight: 700; color: var(--pos); }
.rec { position: absolute; top: -9px; right: 10px; font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--primary); color: var(--primary-ink); }
.verdict-panel .btn-row { margin-top: 18px; }

/* mobile */
.bottom-nav, .fab { display: none; }
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .icon-btn.only-mobile { display: grid; }
  .main { padding: 20px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .bottom-nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 700; color: var(--ink-3); border-radius: 12px; }
  .bottom-nav button.active { color: var(--primary); }
  .fab {
    display: grid; place-items: center; position: fixed; right: 18px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 41;
    width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--primary); color: var(--primary-ink); box-shadow: 0 8px 24px rgba(43,69,212,.35);
  }
  .sheet-wrap { place-items: end stretch; padding: 0; }
  .sheet { width: 100%; max-height: 90vh; border-radius: 22px 22px 0 0; }
  .sheet-foot { padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .quick { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .quick-btn { flex-direction: column; gap: 8px; padding: 12px 4px; text-align: center; font-size: 12px; border-radius: 16px; }
  .pay-opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .planner-form { grid-template-columns: minmax(0, 1fr); }
  .section-bar { flex-direction: column; align-items: stretch; }
  .section-action .btn { width: 100%; justify-content: center; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 420px) {
  .hero-split b { font-size: 15.5px; }
  .row { padding: 12px 16px; gap: 12px; }
  .stat-value { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* live NAV */
.nav-status { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.nav-status-text { display: flex; flex-direction: column; min-width: 0; font-size: 13.5px; }
.nav-status-text b { font-weight: 800; font-size: 14px; }
.nav-status-text span { color: var(--ink-3); font-weight: 500; }
.est-note { display: flex; margin-top: 8px; align-items: flex-start; gap: 7px; font-size: 12.5px; color: var(--warn); font-weight: 600; background: var(--warn-bg); padding: 7px 10px; border-radius: 10px; max-width: 560px; }
.est-note svg { flex-shrink: 0; margin-top: 2px; }
.scheme-name { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.link-note { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--pos-bg); color: var(--ink); font-size: 13.5px; }
.link-note svg { color: var(--pos); flex-shrink: 0; }

/* ───── v3 additions ───── */
.side-cta-row { display: flex; gap: 8px; margin-bottom: 18px; }
.side-cta-row .side-cta { flex: 1; margin: 0; }
.offline-pill { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-weight: 700; font-size: 13px; }
.app-foot { margin: 28px 0 0; font-size: 12px; color: var(--ink-3); text-align: center; }
.nudge.warn { background: var(--warn-bg); }
.nudge.warn svg { color: var(--warn); }
.btn-row.center { justify-content: center; }
.foot-left { margin-right: auto; }
.foot-note { font-weight: 700; color: var(--ink-2); font-size: 14px; align-self: center; }
.link.small { font-size: 13px; }
.row-click { cursor: pointer; transition: background-color .12s; }
.row-click:hover { background: var(--surface-2); }
.row .muted { color: var(--ink-3); }
.is-disabled { opacity: .35; pointer-events: none; }

/* quick add */
.money-input.big { height: 64px; border-radius: 16px; padding-left: 18px; }
.money-input.big span { font-size: 26px; }
.money-input.big input { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.seg-full { display: grid; grid-template-columns: repeat(3, 1fr); }
.seg-full button { padding: 0 6px; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.cat-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 9px; border-radius: 14px; border: 1.5px solid transparent; background: var(--surface-2); font-size: 12px; font-weight: 700; color: var(--ink-2); text-align: center; line-height: 1.2; min-width: 0; }
.cat-btn span:last-child { overflow-wrap: anywhere; }
.cat-btn.on { border-color: var(--primary); background: var(--primary-soft); color: var(--ink); }
.pick-row { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 6px 13px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 13.5px; color: var(--ink-2); max-width: 100%; }
.pick.on { border-color: var(--primary); background: var(--primary-soft); color: var(--ink); }
.pick-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pay-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pay-chips .pick { flex-direction: column; align-items: flex-start; gap: 0; padding: 8px 14px; }
.pay-chips .pick b { font-size: 16px; color: var(--ink); }
.date-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.date-input { width: auto; flex: 1; min-width: 150px; }

/* toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 28px; z-index: 80; display: flex; align-items: center; gap: 14px; max-width: min(92vw, 520px); padding: 12px 14px 12px 18px; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: rise .2s ease; }
.toast-undo { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--primary-soft); font-weight: 800; padding: 6px 8px; border-radius: 8px; }
:root[data-theme="dark"] .toast-undo { color: var(--primary-ink); }

/* month + filters */
.month-switch { display: inline-flex; align-items: center; gap: 6px; }
.month-label { font-weight: 800; font-size: 16px; min-width: 140px; text-align: center; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-3); flex: 1; min-width: 200px; }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; height: 100%; color: var(--ink); }
.search:focus-within { border-color: var(--primary); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 6px 0 12px; border-radius: 99px; background: var(--primary-soft); color: var(--ink); font-weight: 700; font-size: 13px; }
.tag button { border: 0; background: transparent; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
.inline-add { display: flex; gap: 8px; }
.day-total { font-weight: 700; color: var(--ink-3); font-size: 13.5px; }

/* overview month */
.month-big { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
.month-sub { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-3); font-size: 13px; font-weight: 600; margin: 2px 0 12px; }
.mini-cats { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.mini-cats li { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(40px, 30%) auto; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 600; }
.mc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mc-bar { height: 6px; border-radius: 99px; background: var(--muted-bg); overflow: hidden; }
.mc-bar span { display: block; height: 100%; border-radius: 99px; }
.fill-blue-bg { background: var(--t-blue); } .fill-rose-bg { background: var(--t-rose); } .fill-amber-bg { background: var(--t-amber); } .fill-violet-bg { background: var(--t-violet); }
.fill-teal-bg { background: var(--t-teal); } .fill-green-bg { background: var(--t-green); } .fill-sky-bg { background: var(--t-sky); } .fill-slate-bg { background: var(--t-slate); }
.bar-day { fill: var(--t-blue-bg); }
:root[data-theme="dark"] .bar-day { fill: #2A3670; }

/* cards */
.cycle-line { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.cycle-line span { display: inline-flex; align-items: center; gap: 6px; }
.cycle-line .dot { width: 8px; height: 8px; }
.cycle-preview { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: 12px; background: var(--primary-soft); font-size: 13.5px; }
.cycle-preview svg { color: var(--primary); flex-shrink: 0; margin-top: 2px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* funds */
.link-box { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; border: 1px dashed var(--line); }
.link-head { display: flex; align-items: center; gap: 7px; font-size: 13.5px; }
.link-head svg { color: var(--pos); }
.link-chosen { display: flex; align-items: center; gap: 10px; justify-content: space-between; font-size: 13.5px; font-weight: 600; background: var(--pos-bg); padding: 8px 8px 8px 12px; border-radius: 10px; }
.scheme-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; }
.scheme-item { text-align: left; border: 0; background: var(--surface); padding: 10px 12px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line-2); color: var(--ink); }
.scheme-item:hover { background: var(--primary-soft); }
.nav-status { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.nav-status-text { display: flex; flex-direction: column; min-width: 0; font-size: 13.5px; flex: 1; }
.nav-status-text b { font-weight: 800; font-size: 14px; }
.nav-status-text span { color: var(--ink-3); font-weight: 500; }
.est-note { display: flex; align-items: flex-start; gap: 7px; margin-top: 8px; font-size: 12.5px; color: var(--warn) !important; font-weight: 600 !important; background: var(--warn-bg); padding: 7px 10px; border-radius: 10px; }
.est-note svg { flex-shrink: 0; margin-top: 2px; }
.scheme-name { font-size: 12px; color: var(--ink-3); font-weight: 600; }

/* settings */
.block-h { font-size: 14px; font-weight: 800; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; cursor: pointer; }
.switch-row > span { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.switch { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; flex-shrink: 0; cursor: pointer; transition: background-color .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .15s; }
.switch:checked { background: var(--primary); }
.switch:checked::after { transform: translateX(18px); }
.danger-row { margin-top: 6px; }
.budget-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.budget-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 140px; gap: 10px; align-items: center; }
.budget-row label { display: flex; flex-direction: column; font-weight: 700; font-size: 14px; min-width: 0; }
.budget-row .money-input { height: 40px; }

/* vault */
.vault-intro { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 14px 4px; }
.vault-intro h3 { font-size: 20px; font-weight: 800; }
.vault-intro p { margin: 0; color: var(--ink-2); max-width: 52ch; font-size: 14px; }
.vault-form { display: flex; flex-direction: column; gap: 12px; width: min(100%, 360px); text-align: left; margin-top: 8px; }
.vault-form .btn { justify-content: center; }
.pass-input { text-align: center; font-size: 18px; letter-spacing: .2em; }
.warn-box { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); color: var(--ink); font-size: 13px; }
.warn-box svg { color: var(--warn); flex-shrink: 0; margin-top: 2px; }
.vault-banner { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 10px 14px; border-radius: 14px; background: var(--pos-bg); font-size: 13.5px; font-weight: 600; }
.vault-banner svg { color: var(--pos); }
.vault-banner span { flex: 1; }
.secret { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; color: var(--ink-3); white-space: pre-wrap; overflow-wrap: anywhere; user-select: none; }
.secret.open { color: var(--ink); user-select: text; }
.doc-img { display: block; max-width: 100%; max-height: 70vh; margin: 0 auto; border-radius: 12px; }
.doc-file { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 20px 0; }
.doc-file p { margin: 0; }
.lock-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; }
.lock-card { width: min(100%, 420px); padding: 18px; }
.lock-brand { padding: 0; }

/* bottom nav with centre add */
.bn-add { position: relative; }
.bn-add span { display: grid; place-items: center; width: 52px; height: 52px; margin-top: -22px; border-radius: 18px; background: var(--primary); color: var(--primary-ink); box-shadow: 0 8px 22px rgba(43,69,212,.35); }
@media (max-width: 960px) {
  .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
  .two-col { grid-template-columns: 1fr 1fr; }
  .cat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .month-label { min-width: 120px; font-size: 15px; }
}
@media (max-width: 420px) {
  .cat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .budget-row { grid-template-columns: 34px minmax(0, 1fr) 112px; }
  .quick-btn span { font-size: 11.5px; }
}
.sheet-wrap { grid-template-columns: minmax(0, 1fr); }
.sheet { min-width: 0; max-width: 100%; }
.sheet-body, .form-grid { min-width: 0; }
@media (min-width: 961px) { .sheet-wrap { grid-template-columns: minmax(0, 520px); justify-content: center; } }
</style>
